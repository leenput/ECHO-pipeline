start_from: "ubam" #Options: "pod5", "ubam", "fastq", "bam", "cram". Applies to all samples in the run.

# ==================================================================
# SAMPLES & INPUT FILES
# ------------------------------------------------------------------
# Choose ONE of the two ways below to declare your samples and where
# each sample's starting file lives. If both are given, the manifest
# takes priority.
#
# The starting file may live ANYWHERE on disk with ANY filename; it must
# match 'start_from' above:
#   pod5  -> a directory containing .pod5 files
#   ubam  -> an unaligned .bam
#   fastq -> a .fastq
#   bam   -> an aligned, indexed .bam (index optional, see manifest)
#   cram  -> an aligned .cram (decoded into a BAM against 'reference')
# ------------------------------------------------------------------

# --- Option 1: manifest file (recommended for multiple samples) ---
# A TSV or CSV with a header and one row per sample. Columns:
#   sample        (required)  unique sample name
#   input         (required)  path to the starting file / pod5 directory
#   input_index   (optional)  path to a .bai (only used when start_from: bam;
#                             if omitted, a '<input>.bai' next to the BAM is
#                             used, otherwise one is built automatically)
# See configs/manifest_example.tsv for a template.
#
# manifest: "/path/to/samples.tsv"

# --- Option 2: inline sample -> input mapping ---
sample_inputs:
  {sample_name}: "/abs/path/to/sample1.bam"
  {sample_name}: "/data/run7/sample2.bam"

# ------------------------------------------------------------------
# OUTPUT DIRECTORY (always required)
# ------------------------------------------------------------------

output_dir: "/path/to/projects/{project_name}/"

# ------------------------------------------------------------------
# REFERENCE GENOME
# Replace with the path to your reference genome FASTA
# ------------------------------------------------------------------

reference: "/path/to/reference/genome/GRCh38.fasta"
reference_name: "GRCh38" #"chm13v2" or "GRCh38"
reference_TE: "/path/to/TE/reference/teref.ont.human.fa"

# ------------------------------------------------------------------
# FASTQ FILTERING PARAMETERS
# ------------------------------------------------------------------

fastq_filtering:
  min_read_quality: 7
  min_read_length: 500

# ------------------------------------------------------------------
# TANDEM REPEAT (TR) CATALOG
# ------------------------------------------------------------------

tr_catalog: "/path/to/TR/catalog/STRchive-disease-loci.v2.2.1.GRCh38.longTR.bed"
type_of_tr: "pathogenic" # Options: genome-wide, genome-wide-str, pathogenic (ideal for testing), forensic

# ------------------------------------------------------------------
# TRANSPOSABLE ELEMENT (TE) CATALOG
# ------------------------------------------------------------------

# small TE catalog (ideal for testing)
te_catalog: "/path/to/TE/catalog/GRCh38_TEs_retroposon.bed"
type_of_te: "retroposon" #Options: all, all_cpg, DNA, DNA_cpg, LINE, LINE_cpg, helitron, helitron_cpg, SINE, SINE_cpg, LTR, LTR_cpg, retroposon, retroposon_cpg

# Example full catalog
# te_catalog: "/path/to/TE/catalog/GRCh38_TEs_all.bed"
# type_of_te: "all"

# ------------------------------------------------------------------
# ANALYSIS PARAMETERS
# ------------------------------------------------------------------

flanking_length_bp: "250" # flanking regions (bp) to be analysed for methylation and sequence variation
extension_repeat_consensus: "1000" # Bases used to extend repeat consensus for re-mapping
